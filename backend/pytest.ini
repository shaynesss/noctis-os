[pytest]
# Confine collection to tests/.
#
# Written for v1's per-mode config dirs under launch_config/, whose plugins
# shipped test files of their own and broke collection with name clashes.
# That directory went at the 2026-09-12 cutover; the confinement stays,
# because runtime/, data/ and .venv are still no place to look for tests.
testpaths = tests
norecursedirs = runtime data .venv
