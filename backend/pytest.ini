[pytest]
# Confine collection to tests/.
#
# The five per-mode CLAUDE_CONFIG_DIRs under launch_config/ hold real Claude
# Code installs, and the plugins in them ship their own test files. Five
# copies of the same basename cannot be imported into one pytest run, so a
# bare `pytest` in this directory dies during collection -- before running a
# single test of ours -- with a name collision in somebody else's package.
#
# It was harmless until the config dirs were logged into and populated, which
# is the kind of failure that looks like the test suite breaking when nothing
# about the test suite changed.
testpaths = tests
norecursedirs = launch_config runtime data .venv
