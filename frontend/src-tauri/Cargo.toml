[package]
name = "noctis"
version = "2.0.0"
description = "Noctis — the entry point"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "noctis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2.3.3"
# The PTY host. wezterm's crate: 20 transitive deps, ~773KB size-optimised,
# and the only part of this migration that is not already in the tree.
portable-pty = "0.9"
# PTY output crosses the IPC base64-encoded -- a read can split a multi-byte
# character, and xterm.js decodes UTF-8 itself.
base64 = "0.22"

[profile.release]
# The shell is a thin window around a web view; optimising for size keeps
# the bundle honest rather than shipping a 40MB binary to host an iframe.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
